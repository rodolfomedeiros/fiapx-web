# Este container só entrega os arquivos estáticos. Quem roteia `/auth` e `/videos` para os
# serviços é o gateway na frente — manter o roteamento em um lugar só evita que as duas
# configurações divirjam.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # O Vite carimba o hash do conteúdo no nome de cada arquivo em assets/, então eles nunca
  # mudam sem mudar de nome e podem ser cacheados para sempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # O index.html é o oposto: precisa ser revalidado sempre, senão um deploy novo continua
  # apontando para os assets antigos.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
